<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>City Slide Animation</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper/swiper-bundle.min.css" />
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@700&display=swap" rel="stylesheet">
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      text-transform: uppercase;
      font-family: 'Satoshi', sans-serif;
      background: #000;
    }

    .swiper {
      width: 100%;
      height: 100vh;
      position: relative;
    }

    .swiper-slide {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .background-img {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
      transition: opacity 1s ease;
    }

    .slide-text {
      position: relative;
      z-index: 3;
      font-size: 12rem;
      font-weight: 900;
      color: white;
      letter-spacing: 5px;
      text-align: center;
      line-height: 1;
      max-width: 90%;
      mask-image: linear-gradient(to bottom, rgba(255, 255, 255, 1) 60%, rgba(255, 255, 255, 0) 100%);
      -webkit-mask-image: linear-gradient(to bottom, rgba(255, 255, 255, 1) 60%, rgba(255, 255, 255, 0) 100%);
    }

    .overlay {
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.2);
      z-index: 2;
      pointer-events: none;
    }

    .swiper-pagination {
      position: absolute;
      bottom: 20px;
      text-align: center;
      width: 100%;
      z-index: 5;
    }

    .swiper-pagination-bullet {
      background: white;
      opacity: 0.6;
    }

    .swiper-pagination-bullet-active {
      opacity: 1;
    }
  </style>
</head>

<body>

  <div class="swiper">
    <div class="swiper-wrapper">
      <div class="swiper-slide" data-text="Tokyo">
        <img class="background-img"
          src="https://plus.unsplash.com/premium_photo-1680582107403-04dfac02efc3?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" />
        <div class="slide-text">Tokyo</div>
        <div class="overlay"></div>
      </div>
      <div class="swiper-slide" data-text="New York">
        <img class="background-img"
          src="https://plus.unsplash.com/premium_photo-1683888229109-17cb0975af20?q=80&w=1332&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" />
        <div class="slide-text">New York</div>
        <div class="overlay"></div>
      </div>
      <div class="swiper-slide" data-text="Osaka">
        <img class="background-img"
          src="https://plus.unsplash.com/premium_photo-1682048358672-1c5c6c9ed2ae?q=80&w=1332&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" />
        <div class="slide-text">Osaka</div>
        <div class="overlay"></div>
      </div>
    </div>

    <!-- Pagination Dots -->
    <div class="swiper-pagination"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/swiper/swiper-bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>
    const swiper = new Swiper('.swiper', {
      loop: true,
      effect: 'fade',
      fadeEffect: { crossFade: true },
      speed: 3000, // control transition speed (in ms)
      pagination: {
        el: '.swiper-pagination',
        clickable: true
      },
      on: {
        slideChangeTransitionStart: () => {
          const previousSlide = swiper.slides[swiper.previousIndex];
          const currentSlide = swiper.slides[swiper.activeIndex];

          const prevText = previousSlide.querySelector('.slide-text');
          const nextText = currentSlide.querySelector('.slide-text');

          const prevImg = previousSlide.querySelector('.background-img');
          const nextImg = currentSlide.querySelector('.background-img');

          const overlay = currentSlide.querySelector('.overlay');

          // Set initial state for incoming text
          gsap.set(nextText, {
            y: '-100%',
            opacity: 1,
            zIndex: 4
          });

          gsap.set(overlay, { left: '-100%' });

          const tl = gsap.timeline();

          tl
            // Slide previous text downward
            .to(prevText, {
              y: '100%',
              opacity: 0.2,
              duration: 1.2,
              ease: "power2.inOut"
            }, 0)

            // Slide new text downward into place — perfectly synced
            .to(nextText, {
              y: '0%',
              opacity: 1,
              duration: 1.2,
              ease: "power2.inOut"
            }, 0)

            // Background fade
            .to(prevImg, {
              opacity: 0,
              duration: 1.2,
              ease: "power2.out"
            }, 0)

            .fromTo(nextImg, {
              opacity: 0
            }, {
              opacity: 1,
              duration: 1.2,
              ease: "power2.out"
            }, 0)

            // Overlay
            .to(overlay, {
              left: '100%',
              duration: 2,
              ease: "power2.inOut"
            }, 0);
        }
      }

    }
    );
  </script>
</body>

</html>
